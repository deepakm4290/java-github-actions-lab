name: Java CI Practice

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  APP_NAME: JavaApp
  ENVIRONMENT: DEV

jobs:

  build:
    runs-on: ubuntu-latest

    outputs:
      app_name: ${{ steps.build_info.outputs.app_name }}
      build_status: ${{ steps.build_info.outputs.build_status }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Show Java version
        run: java -version

      - name: Show current directory
        run: pwd

      - name: Show project files
        run: ls -la

      - name: Compile Java
        run: javac App.java

      - name: Run Java application
        run: java App

      - name: Build completed
        run: echo "GitHub Actions CI build completed successfully!"

      - name: Create build information
        id: build_info
        run: |
          echo "app_name=JavaApp" >> "$GITHUB_OUTPUT"
          echo "build_status=SUCCESS" >> "$GITHUB_OUTPUT"


  test:
    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Test message
        run: echo "Test job started"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check Java
        run: java -version

      - name: Test completed
        run: echo "Test job completed successfully"


  report:
    runs-on: ubuntu-latest

    needs: [build, test]

    if: always()

    steps:

      - name: Report started
        run: echo "Reporting job started"

      - name: Show build information
        run: |
          echo "Application: ${{ needs.build.outputs.app_name }}"
          echo "Build Status: ${{ needs.build.outputs.build_status }}"

      - name: Report completed
        run: echo "Reporting job completed successfully"